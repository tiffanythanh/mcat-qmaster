<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qbanks — MCAT QMaster</title>
<link rel="stylesheet" href="katex/katex.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* ---------- site bar (shared chrome with the rest of MCAT QMaster) ---------- */
#sitebar{
  display:flex;align-items:center;gap:28px;flex:0 0 auto;
  padding:14px 28px;background:var(--bg2);border-bottom:1px solid var(--line);
  font-family:"Manrope",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
#sitebar .sb-brand{display:flex;align-items:center;gap:10px;text-decoration:none}
#sitebar .sb-mark{width:28px;height:28px;flex:0 0 auto}
#sitebar .sb-name{display:block;font-weight:800;font-size:17px;letter-spacing:-.01em;color:var(--text);line-height:1.15}
#sitebar .sb-tag{display:block;font-size:11px;font-weight:500;color:var(--muted)}
#sitebar .sb-links{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
#sitebar .sb-links a{
  font:600 13.5px "Manrope",sans-serif;color:var(--muted);
  padding:8px 12px;border-radius:6px;text-decoration:none;
}
#sitebar .sb-links a:hover{color:var(--accent)}
#sitebar .sb-links a[aria-current="page"]{color:var(--accent)}
@media (max-width:640px){
  #sitebar{gap:12px;padding:12px 16px}
  #sitebar .sb-links a{padding:6px 8px;font-size:12.5px}
}
:root{
  --bg:#1e1f22; --bg2:#26272b; --bg3:#2f3035; --line:#3a3b40; --text:#e6e6e6; --muted:#9a9ca3;
  --accent:#2F6FED; --ok:#3fbf7f; --bad:#e35d5d; --warn:#e0b23f; --flag:#ff9f43;
  --pass-bg:#232428; --serif:Georgia,"Times New Roman",serif; --sans:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
html[data-theme="light"]{
  --bg:#f7f8fa; --bg2:#ffffff; --bg3:#f1f3f7; --line:#e5e8ee; --text:#1d1f24; --muted:#767b87; --pass-bg:#ffffff;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden}
a{color:var(--accent)}
button,a.btn{font-family:inherit;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--bg3);color:var(--text);border-radius:999px;padding:8px 16px;text-decoration:none;display:inline-block}
button:hover,a.btn:hover{filter:brightness(1.12)}
button.primary,a.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.small,a.btn.small{padding:6px 13px;font-size:12px}
button:disabled{opacity:.5;cursor:not-allowed;filter:none}
input[type=text],input[type=search],input[type=number],textarea,select{font-family:inherit;font-size:14px;background:var(--bg2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
input[type=checkbox]{accent-color:var(--accent)}
textarea{width:100%;min-height:90px;resize:vertical}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;background:var(--bg2);border-bottom:1px solid var(--line);flex:0 0 auto}
header h1{font-size:17px;margin:0;font-weight:600;white-space:nowrap}
header .spacer{flex:1}
header .hdr-nav{display:flex;gap:8px}
.menu-wrap{position:relative}
#btn-more{font-size:16px;line-height:1;padding:7px 12px}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:2px;min-width:180px;box-shadow:0 10px 28px rgba(0,0,0,.2);z-index:30}
.menu button,.menu label.small{width:100%;justify-content:flex-start;text-align:left;border-radius:8px;border-color:transparent;background:transparent;padding:8px 10px}
.menu button:hover,.menu label.small:hover{background:var(--bg3);filter:none}
.menu label.small{display:block;margin:0;cursor:pointer}
#layout{display:flex;flex:1;min-height:0}
#sidebar{display:none;background:var(--bg2);border:1px solid var(--line);border-radius:14px;flex-direction:column;min-height:0;margin-bottom:16px}
#sidebar.in-dash{display:flex}
#sidebar.in-dash #tree{max-height:70vh}
#sidebar .tools{padding:8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
#sidebar .tools-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#sidebar .tools-row.primary input{flex:1;min-width:120px}
#sidebar .tools-row.secondary{gap:8px}
#sidebar .tools-row.secondary select{font-size:11.5px;padding:4px 8px;border-radius:8px;color:var(--muted);background:var(--bg3);border-color:var(--line)}
#sidebar .tools-row.secondary label{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap;margin-left:auto}
#tree{overflow:auto;flex:1;font-size:13.5px}
.tr{display:flex;align-items:center;padding:4px 8px;border-bottom:1px solid var(--line);cursor:pointer;gap:6px}
.tr:hover{background:var(--bg3)}
.tr.lvl0{font-weight:600}
.tr.lvl1{padding-left:22px;font-weight:600}
.tr.lvl2{padding-left:40px;font-weight:400}
.tr.lvl3{padding-left:58px;font-weight:400}
.tr .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .num{width:46px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px}
.tr .num.ok{color:var(--ok)} .tr .num.bad{color:var(--bad)}
.tr .tw{width:12px;color:var(--muted);font-size:11px}
.tr.active{background:rgba(47,111,237,.14)}
.tr .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:0 0 8px}
.tr .dot.done{background:var(--ok)} .tr .dot.partial{background:var(--warn)}
.tr .flag{color:var(--flag);font-size:12px}
.hdr-row{display:flex;padding:6px 8px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line)}
.hdr-row .name{flex:1}.hdr-row .num{width:46px;text-align:right}
#main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
#content{flex:1;min-height:0;overflow:auto}
.page{padding:28px 32px;max-width:1200px;margin:0 auto}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:20px 24px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:18px}
.kpi .v{font-size:26px;font-weight:700}.kpi .l{color:var(--muted);font-size:12.5px}
.bar{height:8px;background:var(--bg3);border-radius:6px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--ok)}
table.simple{border-collapse:collapse;width:100%;font-size:13.5px}
table.simple th,table.simple td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
table.simple td.n{text-align:right;font-variant-numeric:tabular-nums}
/* passage view */
#pv{display:flex;flex-direction:column;height:100%;min-height:0}
#pv .bar-top{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--bg2);flex-wrap:wrap}
#pv .bar-top .title{font-weight:600;font-size:15px}
#pv .bar-top .crumb{color:var(--muted);font-size:12.5px}
#pv .split{display:flex;flex:1;min-height:0}
#passage{flex:1 1 50%;min-width:0;overflow:auto;padding:24px 32px;background:var(--pass-bg);border-right:1px solid var(--line);font-family:var(--sans);font-size:16px;line-height:1.62}
#qpane{flex:1 1 50%;min-width:0;overflow:auto;padding:20px 28px;display:flex;flex-direction:column}
.qnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.qnav button{width:34px;height:30px;padding:0;border-radius:8px;position:relative}
.qnav button.cur{outline:2px solid var(--accent)}
.qnav button.ok{background:rgba(63,191,127,.25);border-color:var(--ok)}
.qnav button.bad{background:rgba(227,93,93,.25);border-color:var(--bad)}
.qnav button.flagged::after{content:"⚑";position:absolute;top:-8px;right:-4px;color:var(--flag);font-size:11px}
.stem{font-size:15.5px;margin-bottom:12px}
.stem p{margin:0 0 10px}
.choices{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;background:var(--bg2)}
.choice:hover{background:var(--bg3)}
.choice .letter{font-weight:700;width:26px;height:26px;flex:0 0 26px;border:1px solid transparent;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--bg3)}
.choice:hover .letter{border-color:var(--accent)}
.choice.sel .letter{background:var(--accent);border-color:var(--accent);color:#fff}
.choice .body{cursor:pointer}
.hl{background:rgba(255,214,0,.45);cursor:pointer;border-radius:2px}
html[data-theme="light"] .hl{background:rgba(255,230,0,.6)}
.hl:hover{background:rgba(255,120,0,.45)}
#passage,.stem{user-select:text}
.pill.jw{border-color:#7c5cff;color:#a58cff}
.cexpl{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--muted)}
.choice.correct .cexpl{color:var(--text)}
.md .perchoice p{margin:4px 0}
.md p{margin:0 0 10px}
.md .passage-title{font-weight:700}
.stem p:last-child{margin-bottom:0}
.choice.sel{border-color:var(--accent);background:rgba(47,111,237,.1)}
.choice.correct{border-color:var(--ok);background:rgba(63,191,127,.14)}
.choice.wrong{border-color:var(--bad);background:rgba(227,93,93,.14)}
.choice.struck .body{text-decoration:line-through;opacity:.5}
.choice .body{flex:1}
.choice .body p{margin:0}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.verdict{font-weight:700}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.expl{border-left:3px solid var(--accent);padding:8px 16px;margin:10px 0;background:var(--bg2);border-radius:0 12px 12px 0}
.expl h4{margin:6px 0;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.expl .step{padding:6px 0;border-bottom:1px dashed var(--line)}
.expl .step:last-child{border-bottom:0}
.md img{max-width:100%;height:auto;display:block;margin:8px auto;background:#fff;border-radius:4px}
.md table{border-collapse:collapse;margin:10px 0;font-family:var(--sans);font-size:14px}
.md th,.md td{border:1px solid var(--line);padding:4px 8px;vertical-align:top}
.md th{background:var(--bg3)}
.md h1,.md h2,.md h3{font-size:1.1em;margin:12px 0 6px}
.md .caption{text-align:center;color:var(--muted);font-size:13px;font-family:var(--sans)}
.md .ptitle{font-weight:700;margin-bottom:8px}
.md .labels{font-size:13px;color:var(--muted)}
.notes{margin-top:auto;padding-top:12px}
.notes label{font-size:12.5px;color:var(--muted)}
.muted{color:var(--muted)}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted)}
.list-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.list-item .t{flex:1}
.list-item a{text-decoration:none;color:var(--text)}
.list-item a:hover{color:var(--accent)}
.right{margin-left:auto}
.timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
kbd{border:1px solid var(--line);border-radius:6px;padding:0 5px;font-size:12px;background:var(--bg3)}
.hidden{display:none!important}
@media (max-width:900px){#sidebar{width:300px;flex-basis:300px}#pv .split{flex-direction:column}#passage{border-right:0;border-bottom:1px solid var(--line);max-height:45%}}
</style>
</head>

  <a class="sb-brand" href="../">
    <svg class="sb-mark" viewBox="0 0 100 100" aria-hidden="true">
      <defs>

          <stop offset="0" stop-color="#1E4FD1"/>

  <span class="spacer"></span>

    <button class="small" id="btn-build">Build a Block</button>
  </nav>

    <button class="small" id="btn-more" aria-haspopup="true" aria-expanded="false" title="More">⋯</button>

      <button class="small" id="btn-theme">Theme</button>

        <select id="content-mode"><option value="all">Passages + question sets</option><option value="passage">Passages only</option><option value="qset">Question sets only</option></select>

<script src="katex/katex.min.js"></script>
<script src="data.js"></script>
<script>
(function(){
'use strict';
const DATA = window.KA_DATA; const IMG = window.KA_IMG || {};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const LETTERS = 'ABCDEFGHIJ';
const PKEY = 'ka-mcat-progress-v1';

/* ---------- embedding detection ---------- */
/* ---------- progress store ---------- */
let P = load();
function load(){ try{ const j=JSON.parse(localStorage.getItem(PKEY)); if(j && j.items) return j; }catch(e){} return {items:{},passages:{},log:[]}; }
function save(){ try{ localStorage.setItem(PKEY, JSON.stringify(P)); }catch(e){} refreshHeader(); }
function itemState(id){ return P.items[id] || null; }
function passState(id){ return P.passages[id] || (P.passages[id]={}); }

/* ---------- indexes ---------- */
const byId = {}; DATA.passages.forEach(p=>byId[p.id]=p);
const SUBJ = DATA.subjects; // [{name, sections:[names]}]
function passagesOf(subject, section){ return DATA.passages.filter(p=>p.uworld.subject===subject && p.uworld.section===section); }
function stats(list){ let qs=0,done=0,right=0,flag=0; for(const p of list){ for(const it of p.items){ qs++; const s=itemState(it.id); if(s&&s.answered){done++; if(s.correct) right++;} if(s&&s.flag) flag++; } } return {qs,done,right,flag}; }
function pStatus(p){ const s=stats([p]); if(s.done===0) return 'none'; if(s.done>=s.qs) return 'done'; return 'partial'; }

/* ---------- build-a-block ---------- */
let buildChecked = (()=>{ try{ return JSON.parse(localStorage.getItem('ka-mcat-build-sections'))||{}; }catch(e){ return {}; } })();
let buildCountsCache = null;
let buildTotal = '25', buildMax = '15';
let currentBlock = null; // {chunks:[[passageId,...],...], chunkIndex}
function buildSecKey(subName,sec){ return subName+'|'+sec; }
function computeBuildCounts(){
  if(buildCountsCache) return buildCountsCache;
  const subj={}, sec={};
  for(const sub of SUBJ){ let t=0; for(const s of sub.sections){ const list=passagesOf(sub.name,s); const qs=list.reduce((a,p)=>a+p.items.length,0); sec[buildSecKey(sub.name,s)]=qs; t+=qs; } subj[sub.name]=t; }
  buildCountsCache={subj,sec}; return buildCountsCache;
}
function isSecChecked(subName,sec){ return !!buildChecked[buildSecKey(subName,sec)]; }
function setSecChecked(subName,sec,val){ buildChecked[buildSecKey(subName,sec)]=val; try{ localStorage.setItem('ka-mcat-build-sections',JSON.stringify(buildChecked)); }catch(e){} }
function isSubjChecked(sub){ return sub.sections.every(s=>isSecChecked(sub.name,s)); }
function isSubjIndeterminate(sub){ const c=sub.sections.filter(s=>isSecChecked(sub.name,s)).length; return c>0 && c<sub.sections.length; }
function checkedSections(){ const out=[]; for(const sub of SUBJ) for(const sec of sub.sections) if(isSecChecked(sub.name,sec)) out.push([sub.name,sec]); return out; }
function eligiblePassages(){ const secs=checkedSections(); if(!secs.length) return []; const set=new Set(secs.map(([a,b])=>a+'|'+b)); return DATA.passages.filter(p=>set.has(p.uworld.subject+'|'+p.uworld.section) && p.items && p.items.length); }
function canGenerate(){ return eligiblePassages().length>0; }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function generateBlock(total,maxPerBlock){
  const pool=shuffle(eligiblePassages());
  const selected=[]; let sum=0;
  for(const p of pool){ if(sum>=total) break; selected.push(p); sum+=p.items.length; }
  const chunks=[]; let cur=[], curSum=0;
  for(const p of selected){ if(cur.length && curSum+p.items.length>maxPerBlock){ chunks.push(cur); cur=[]; curSum=0; } cur.push(p); curSum+=p.items.length; }
  if(cur.length) chunks.push(cur);
  return chunks;
}

/* ---------- markdown / perseus rendering ---------- */
function imgSrc(u){ return IMG[u] || u; }
function renderMath(tex, display){ try{ return katex.renderToString(tex,{displayMode:display,throwOnError:false,strict:false}); }catch(e){ return '<code>'+esc(tex)+'</code>'; } }
function inline(s){
  // protect math
  const maths=[]; s=s.replace(/\\\$/g,'\x03');
  s=s.replace(/\$\$([\s\S]+?)\$\$/g,(m,t)=>{maths.push(renderMath(t.replace(/\x03/g,'\\$'),true));return ''+(maths.length-1)+'';});
  s=s.replace(/\$([^$\n]+?)\$/g,(m,t)=>{maths.push(renderMath(t.replace(/\x03/g,'\\$'),false));return ''+(maths.length-1)+'';});
  s=s.replace(/\x03/g,'$');
  s=esc(s);
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+[^)]*)?\)/g,(m,alt,u)=>'<img src="'+esc(imgSrc(u))+'" alt="'+esc(alt)+'">');
  s=s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/\*\*([^*]+?)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/__([^_]+?)__/g,'<strong>$1</strong>');
  s=s.replace(/(^|[\s(>])\*([^*\n]+?)\*(?=[\s.,;:!?)<]|$)/g,'$1<em>$2</em>');
  s=s.replace(/(^|[\s(>])_([^_\n]+?)_(?=[\s.,;:!?)<]|$)/g,'$1<em>$2</em>');
  s=s.replace(/~~([^~]+?)~~/g,'<del>$1</del>');
  s=s.replace(/`([^`]+?)`/g,'<code>$1</code>');
  s=s.replace(/  \n/g,'<br>');
  s=s.replace(/(\d+)/g,(m,i)=>maths[+i]);
  return s;
}
function tableHtml(lines){
  const rows=lines.filter(l=>!/^\s*\|?\s*:?-{2,}/.test(l)).map(l=>l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim()));
  if(!rows.length) return '';
  let h='<table>'; rows.forEach((r,i)=>{ h+='<tr>'+r.map(c=>(i===0?'<th>':'<td>')+inline(c)+(i===0?'</th>':'</td>')).join('')+'</tr>'; }); return h+'</table>';
}
function md(src, widgets, ctx){
  if(!src) return '';
  if(ctx && ctx.fmt==='html') return String(src);
  src=String(src).replace(/\r/g,'');
  const blocks=src.split(/\n{2,}/); let out='';
  for(let b of blocks){
    b=b.replace(/^\n+|\n+$/g,''); if(!b.trim()) continue;
    const lines=b.split('\n');
    // widget-only block
    const wm=b.trim().match(/^\[\[☃ ([^\]]+)\]\]$/);
    if(wm){ out+=widgetHtml(wm[1].trim(), widgets, ctx); continue; }
    if(lines.length>1 && lines.every(l=>/^\s*\|/.test(l)||/^\s*:?-{2,}/.test(l))){ out+=tableHtml(lines); continue; }
    if(lines.every(l=>/^\s*([-*+]|\d+\.)\s+/.test(l))){ const ol=/^\s*\d+\./.test(lines[0]); out+=(ol?'<ol>':'<ul>')+lines.map(l=>'<li>'+inline(l.replace(/^\s*([-*+]|\d+\.)\s+/,''))+'</li>').join('')+(ol?'</ol>':'</ul>'); continue; }
    const hm=b.match(/^(#{1,6})\s+(.*)$/s); if(hm && lines.length===1){ out+='<h'+hm[1].length+'>'+inline(hm[2])+'</h'+hm[1].length+'>'; continue; }
    if(/^>/.test(b)){ out+='<blockquote>'+inline(lines.map(l=>l.replace(/^>\s?/,'')).join(' '))+'</blockquote>'; continue; }
    // paragraph, may contain inline widgets
    let para=lines.join(' ');
    para=para.replace(/\[\[☃ ([^\]]+)\]\]/g,(m,n)=>''+n.trim()+'');
    let html=inline(para);
    html=html.replace(/([^]+)/g,(m,n)=>widgetHtml(n,widgets,ctx));
    out+='<p>'+html+'</p>';
  }
  return out;
}
function widgetHtml(name, widgets, ctx){
  const w=widgets&&widgets[name]; if(!w) return '';
  const o=w.options||{};
  switch(w.type){
    case 'radio': return ''; // rendered as choices
    case 'image': { let h=''; if(o.title) h+='<div class="ptitle">'+inline(o.title)+'</div>'; if(o.backgroundImage&&o.backgroundImage.url) h+='<img src="'+esc(imgSrc(o.backgroundImage.url))+'" alt="'+esc(o.alt||'')+'">'; if(o.labels&&o.labels.length) h+='<div class="labels">'+o.labels.map(l=>inline(l.content||'')).join(' · ')+'</div>'; if(o.caption) h+='<div class="caption">'+inline(o.caption)+'</div>'; return h; }
    case 'table': { const hd=o.headers||[]; const rows=o.answers||[]; let h='<table>'; if(hd.some(x=>x)) h+='<tr>'+hd.map(c=>'<th>'+inline(c||'')+'</th>').join('')+'</tr>'; rows.forEach(r=>{ h+='<tr>'+r.map(c=>'<td>'+inline(c||'')+'</td>').join('')+'</tr>'; }); return h+'</table>'; }
    case 'passage': { let h='<div class="passage-widget">'; if(o.passageTitle) h+='<div class="ptitle">'+inline(o.passageTitle)+'</div>'; let t=String(o.passageText||'').replace(/\{\{[^}]*\}\}/g,'').replace(/\^([^\s]+)/g,'<sup>$1</sup>'); h+=md(t,{},ctx); if(o.footnotes) h+='<div class="caption">'+md(o.footnotes,{},ctx)+'</div>'; return h+'</div>'; }
    case 'explanation': return '<details><summary>'+inline(o.showPrompt||'Explanation')+'</summary>'+md(o.explanation||'',o.widgets||{},ctx)+'</details>';
    case 'video': return o.location?'<p class="muted">[Video: '+esc(o.location)+']</p>':'';
    case 'definition': return '<abbr title="'+esc(o.definition||'')+'">'+inline(o.together||'')+'</abbr>';
    default: return '<p class="muted">[Unsupported widget: '+esc(w.type)+']</p>';
  }
}

   +'<button class="small" id="btn-prev" '+(qi===0?'disabled':'')+'>← Prev</button><button class="small" id="btn-next" '+(qi===p.items.length-1?'disabled':'')+'>Next →</button></div>';
  if(st.answered||st.showExpl){ h+='<div class="expl md"><h4>Explanation</h4>'+(it.hints.length?it.hints.map(x=>'<div class="step">'+md(x.content,x.widgets,p)+'</div>').join(''):'<div class="muted">No explanation provided.</div>')+'</div>'; }
  else h+='<div><button class="small" id="btn-expl">Show explanation (marks as viewed)</button></div>';
  h+='<div class="notes"><label>Notes for this passage</label><textarea id="notes" placeholder="Your notes…">'+esc(ps.notes||'')+'</textarea></div>';
  h+='</div></div></div>';
  $('#content').innerHTML=h;
  // handlers
  $('#content').querySelectorAll('.qnav button').forEach(b=>b.onclick=()=>{ location.hash='#/passage/'+p.id+'/'+b.dataset.q; });
  $('#content').querySelectorAll('.choice').forEach(el=>{
    el.onclick=(e)=>{ if(st.answered) return; const i=+el.dataset.i; let s=itemState(it.id)||{}; s.strikes=s.strikes||{};
      if(e.target.closest('.body')){ if(window.getSelection&&String(window.getSelection()).trim()) return; s.strikes[i]=!s.strikes[i]; if(s.strikes[i]&&!multi&&(s.selected||[]).includes(i)) s.selected=[]; P.items[it.id]=s; save(); renderPassage(p,qi); return; }
      let cur=s.selected||[]; if(multi){ cur=cur.includes(i)?cur.filter(x=>x!==i):cur.concat(i); } else cur=[i]; s.selected=cur; s.strikes[i]=false; P.items[it.id]=s; save(); renderPassage(p,qi); };
    el.oncontextmenu=(e)=>{ e.preventDefault(); const i=+el.dataset.i; let s=itemState(it.id)||{}; s.strikes=s.strikes||{}; s.strikes[i]=!s.strikes[i]; P.items[it.id]=s; save(); renderPassage(p,qi); };
  });
  const parseNum=v=>{ v=String(v).trim().replace(/,/g,''); const f=v.match(/^(-?\d+(?:\.\d+)?)\s*\/\s*(-?\d+(?:\.\d+)?)$/); if(f) return +f[1]/+f[2]; const n=parseFloat(v); return isNaN(n)?null:n; };
  const chk=$('#btn-check'); if(chk) chk.onclick=()=>{ let s=itemState(it.id)||{}; let ok;
    if(it.numeric && !radio.length){ const raws=[...document.querySelectorAll('.num-in')].map(e=>e.value); ok=true; for(let k=0;k<it.numeric.length;k++){ const n=parseNum(raws[k]||''); if(n===null){ alert('Enter a number for each blank (e.g. 3.5, -2, or 1/2).'); return; } const v=+it.numeric[k].value; const tol=Math.max(+it.numeric[k].maxError||0, Math.abs(v)*0.005, 1e-9); if(Math.abs(n-v)>tol) ok=false; } s.numAnswer=raws; }
    else { const cur=s.selected||[]; if(!cur.length){ alert('Pick an answer first.'); return; } const correctSet=radio.map((c,i)=>c.correct?i:-1).filter(i=>i>=0); ok=cur.length===correctSet.length&&cur.every(i=>correctSet.includes(i)); }
    s.answered=true; s.correct=ok; s.t=Date.now(); P.items[it.id]=s; P.log=(P.log||[]).concat({p:p.id,q:qi,ok,t:Date.now()}).slice(-500); save(); renderPassage(p,qi); };
  document.querySelectorAll('.num-in').forEach(ni=>ni.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); const b=$('#btn-check'); if(b) b.click(); } }));
  const rt=$('#btn-retry'); if(rt) rt.onclick=()=>{ P.items[it.id]={flag:st.flag}; save(); renderPassage(p,qi); };
  const ex=$('#btn-expl'); if(ex) ex.onclick=()=>{ let s=itemState(it.id)||{}; s.showExpl=true; P.items[it.id]=s; save(); renderPassage(p,qi); };
  $('#btn-flag').onclick=()=>{ let s=itemState(it.id)||{}; s.flag=!s.flag; P.items[it.id]=s; save(); renderPassage(p,qi); };
  $('#btn-fullscreen').onclick=()=>{
    if(document.fullscreenElement){ document.exitFullscreen().catch(e=>console.warn('exitFullscreen failed',e)); }
    else { document.documentElement.requestFullscreen().catch(e=>console.warn('requestFullscreen failed',e)); }
  };
  updateFullscreenBtn();
  $('#btn-prev').onclick=()=>{ location.hash='#/passage/'+p.id+'/'+(qi-1); };
  $('#btn-next').onclick=()=>{ location.hash='#/passage/'+p.id+'/'+(qi+1); };
  $('#notes').oninput=(e)=>{ ps.notes=e.target.value; save(); };
  setupHighlights(p, it, ps);
  // timer
  if(timerId) clearInterval(timerId); const t0=Date.now(); const prevSec=ps.seconds||0;
  timerId=setInterval(()=>{ const s=prevSec+Math.floor((Date.now()-t0)/1000); ps.seconds=s; const el=$('#timer'); if(!el){clearInterval(timerId);return;} el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); if(s%15===0) save(); },1000);
  renderBlockBar(p);
}

/* ---------- highlighting ---------- */
function textNodesOf(root){ const out=[]; const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null); let n; while((n=w.nextNode())) out.push(n); return out; }
function offsetOf(root, node, off){ let total=0; for(const t of textNodesOf(root)){ if(t===node) return total+off; total+=t.nodeValue.length; } if(node.nodeType===1){ // element boundary: count text before child index
    let total2=0; const nodes=textNodesOf(root); const target=node.childNodes[off]; for(const t of nodes){ if(target && (t===target || target.contains(t))) return total2; total2+=t.nodeValue.length; } return off>=node.childNodes.length?total2:0; } return -1; }
function applyHighlights(root, ranges){
  root.querySelectorAll('span.hl').forEach(sp=>{ const parent=sp.parentNode; while(sp.firstChild) parent.insertBefore(sp.firstChild,sp); parent.removeChild(sp); parent.normalize(); });
  ranges.forEach((r,idx)=>{ const [start,end]=r; let pos=0; for(const t of textNodesOf(root)){ const len=t.nodeValue.length; const a=Math.max(start,pos), b=Math.min(end,pos+len); if(a<b && t.parentNode && !t.parentNode.closest('.katex-mathml')){ const range=document.createRange(); range.setStart(t,a-pos); range.setEnd(t,b-pos); const span=document.createElement('span'); span.className='hl'; span.dataset.h=idx; range.surroundContents(span); } pos+=len; if(pos>=end) break; } });
}
function setupHighlights(p, it, ps){
  ps.hl=ps.hl||{};
  const targets=[['passage',$('#passage')],[it.id,$('#content .stem')]].filter(x=>x[1]);
  for(const [key,root] of targets){
    const ranges=ps.hl[key]||[]; applyHighlights(root, ranges);
    root.onmouseup=()=>{ setTimeout(()=>{ const sel=window.getSelection(); if(!sel||sel.isCollapsed||!sel.rangeCount) return; const rg=sel.getRangeAt(0); if(!root.contains(rg.startContainer)||!root.contains(rg.endContainer)) return; const a=offsetOf(root,rg.startContainer,rg.startOffset), b=offsetOf(root,rg.endContainer,rg.endOffset); if(a<0||b<0||b-a<1) return; const list=(ps.hl[key]||[]).filter(r=>r[1]<=a||r[0]>=b); // merge overlaps
        const merged=[Math.min(a,...(ps.hl[key]||[]).filter(r=>!(r[1]<=a||r[0]>=b)).map(r=>r[0])), Math.max(b,...(ps.hl[key]||[]).filter(r=>!(r[1]<=a||r[0]>=b)).map(r=>r[1]))];
        list.push(merged); list.sort((x,y)=>x[0]-y[0]); ps.hl[key]=list; save(); sel.removeAllRanges(); applyHighlights(root, list); },10); };
    root.onclick=(e)=>{ const sp=e.target.closest('span.hl'); if(!sp) return; const sel=window.getSelection(); if(sel&&!sel.isCollapsed) return; const idx=+sp.dataset.h; const list=(ps.hl[key]||[]).filter((r,i)=>i!==idx); ps.hl[key]=list; save(); applyHighlights(root, list); e.stopPropagation(); };
  }
}

document.addEventListener('keydown',e=>{ if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT') return; const m=location.hash.match(/^#\/passage\/([^/]+)(?:\/(\d+))?/); if(!m) return; const p=byId[m[1]]; const qi=+(m[2]||0); const it=p.items[qi];
  if(e.key==='ArrowRight'&&qi<p.items.length-1) location.hash='#/passage/'+p.id+'/'+(qi+1);
  else if(e.key==='ArrowLeft'&&qi>0) location.hash='#/passage/'+p.id+'/'+(qi-1);
  else if(/^[a-jA-J]$/.test(e.key)){ const i=LETTERS.indexOf(e.key.toUpperCase()); const el=$('#content').querySelector('.choice[data-i="'+i+'"]'); if(el) el.click(); }
  else if(e.key==='Enter'){ const b=$('#btn-check'); if(b) b.click(); }
  else if(e.key==='f'||e.key==='F'){ $('#btn-flag').click(); }
});

/* ---------- header buttons ---------- */
$('#btn-dash').onclick=()=>{ location.hash='#/dash'; };
$('#btn-build').onclick=()=>{ location.hash='#/build'; };
(function(){
  const moreBtn=$('#btn-more'), menu=$('#hdr-menu');
  function closeMenu(){ menu.classList.add('hidden'); moreBtn.setAttribute('aria-expanded','false'); }
  function openMenu(){ menu.classList.remove('hidden'); moreBtn.setAttribute('aria-expanded','true'); }
  moreBtn.addEventListener('click',(e)=>{ e.stopPropagation(); if(menu.classList.contains('hidden')) openMenu(); else closeMenu(); });
  document.addEventListener('click',(e)=>{ if(!menu.classList.contains('hidden') && e.target!==moreBtn && !menu.contains(e.target)) closeMenu(); });
  document.addEventListener('keydown',(e)=>{ if(e.key==='Escape') closeMenu(); });
  menu.querySelectorAll('button').forEach(b=>b.addEventListener('click',closeMenu));
})();
$('#btn-theme').onclick=()=>{ const t=document.documentElement.dataset.theme==='light'?'dark':'light'; document.documentElement.dataset.theme=t; localStorage.setItem('ka-mcat-theme',t); };
document.documentElement.dataset.theme=localStorage.getItem('ka-mcat-theme')||'light';
$('#btn-export').onclick=()=>{ const blob=new Blob([JSON.stringify(P)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='mcat-passage-progress-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); };
$('#btn-import').onclick=()=>$('#imp').click();
$('#imp').onchange=(e)=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const j=JSON.parse(r.result); if(!j.items) throw 0; if(confirm('Replace current progress with the imported file?')){ P=j; save(); route(); } }catch(err){ alert('Not a valid progress file.'); } }; r.readAsText(f); };
$('#btn-reset').onclick=()=>{ if(confirm('Erase ALL progress, notes and flags?')){ P={items:{},passages:{},log:[]}; save(); route(); } };

refreshHeader(); route();
})();
</script>
